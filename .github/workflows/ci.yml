name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --locked --all-extras

      - name: Run the complete test suite
        run: uv run --locked python -m unittest discover -v

      - name: Run the optional curator test suite
        run: >-
          uv run --locked --no-dev --extra curator python -m unittest
          discover -s packages/curator/tests -v

      - name: Validate the bundled catalog
        run: uv run --locked embed-context validate

      - name: Verify the isolated MCP extra
        run: >-
          uv run --locked --no-dev --extra mcp python -m unittest
          tests.test_mcp_server -v

  package:
    name: Build and install wheel
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Build release artifacts
        run: uv build --all-packages

      - name: Verify the base wheel outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/embed-context-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/embed-context-bin
        run: |
          uv tool install "${GITHUB_WORKSPACE}"/dist/embedv2_agent_context-0.9.0-py3-none-any.whl
          "${UV_TOOL_BIN_DIR}/embed-context" --version
          "${UV_TOOL_BIN_DIR}/embed-context" validate
          if "${UV_TOOL_BIN_DIR}/embed-context" curate --no-open 2>curator-error.log; then
            echo "base-only curator command unexpectedly succeeded" >&2
            exit 1
          fi
          grep -q "optional curator companion package" curator-error.log

      - name: Verify optional interfaces outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/embed-context-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/embed-context-bin
        run: |
          uv tool install --reinstall \
            --with "${GITHUB_WORKSPACE}"/dist/embedv2_agent_context_curator-0.9.0-py3-none-any.whl \
            --with mcp==2.0.0 \
            "${GITHUB_WORKSPACE}"/dist/embedv2_agent_context-0.9.0-py3-none-any.whl
          "${UV_TOOL_BIN_DIR}/embed-context-mcp" --version
          "${UV_TOOL_BIN_DIR}/embed-context" curate --no-open --port 8123 >curator.log 2>&1 &
          curator_pid=$!
          trap 'kill "${curator_pid}" 2>/dev/null || true' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8123/ >curator.html
          grep -q "EMBED catalog curator" curator.html
          curl --fail \
            -H 'Content-Type: application/json' \
            -H 'Origin: http://127.0.0.1:8123' \
            --data '{"discard_unsaved":true}' \
            http://127.0.0.1:8123/api/shutdown
          wait "${curator_pid}"
          trap - EXIT
