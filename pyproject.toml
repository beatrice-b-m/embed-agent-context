[project]
name = "embedv2-agent-context"
version = "0.7.0"
description = "Count-free clinical-semantic context for EMBED data"
readme = "README.md"
authors = [
    { name = "Beatrice Brown-Mulry" },
]
requires-python = ">=3.11,<3.14"
dependencies = []
keywords = ["EMBED", "breast imaging", "clinical semantics", "MCP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Repository = "https://github.com/beatrice-b-m/embedv2-agent-context"
Issues = "https://github.com/beatrice-b-m/embedv2-agent-context/issues"
Documentation = "https://github.com/beatrice-b-m/embedv2-agent-context#readme"
"EMBED Documentation" = "https://docs.hitilab.com/datasets/embed"

[project.scripts]
embed-context = "embed_context.cli:main"
embed-context-mcp = "embed_context.mcp_server:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.0.0",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pyarrow==20.0.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embed_context"]

[tool.hatch.build.targets.wheel.force-include]
"catalog/catalog.json" = "embed_context/_data/catalog.json"
"catalog/catalog.schema.json" = "embed_context/_data/catalog.schema.json"

[tool.uv]
package = true
